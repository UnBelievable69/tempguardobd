name: FanController

options:
  bundleIdPrefix: com.example

targets:
  FanController:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "Приложению требуется доступ к Bluetooth для подключения к диагностическому адаптеру ELM327 и управления вентилятором."
        NSBluetoothPeripheralUsageDescription: "Приложению требуется доступ к Bluetooth для работы с OBD2 сканером."
        CFBundleDisplayName: FanController
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    dependencies:
      - package: SwiftOBD2
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  SwiftOBD2:
    url: https://github.com/kkonteh97/SwiftOBD2
    branch: main
