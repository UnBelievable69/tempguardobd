name: FanController

options:
  bundleIdPrefix: com.example
  xcodeVersion: "16.0"

targets:
  FanController:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        # ===== КРИТИЧЕСКИ ВАЖНО — без этого iOS убивает приложение =====
        UILaunchScreen: {}

        # ===== Обязательные ключи =====
        CFBundleDisplayName: FanController
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true

        # ===== Bluetooth разрешения =====
        NSBluetoothAlwaysUsageDescription: "Приложению требуется доступ к Bluetooth для подключения к диагностическому адаптеру ELM327 и управления вентилятором."
        NSBluetoothPeripheralUsageDescription: "Приложению требуется доступ к Bluetooth для работы с OBD2 сканером."
    dependencies:
      - package: SwiftOBD2
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      # Гарантируем, что SPM-зависимости встроены как статические
      SWIFT_EMIT_LOC_STRINGS: YES

packages:
  SwiftOBD2:
    url: https://github.com/kkonteh97/SwiftOBD2
    branch: main
