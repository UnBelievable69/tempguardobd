name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    # Принудительно вычищаем любые сломанные кэши и файлы прошлых сборок
    - name: Hard Clean SPM Cache
      run: |
        echo "Cleaning old caches..."
        rm -rf .build/
        rm -f Package.resolved
        rm -rf ~/Library/Caches/org.swift.swiftpm/
        rm -rf ~/Library/Developer/Xcode/DerivedData/

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build iOS Application
      run: |
        xcodebuild build \
          -packagepath . \
          -scheme FanController \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          BUILD_DIR="build" \
          -configuration Release

    - name: Package App Binary into IPA
      run: |
        mkdir -p build/Payload
        find build -name "FanController.app" -type d -exec cp -r {} build/Payload/ \;
        cd build
        zip -r FanController.ipa Payload
        echo "IPA File successfully created!"

    - name: Upload Finished IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FanController-Unsigned-IPA
        path: build/FanController.ipa
        retention-days: 5
