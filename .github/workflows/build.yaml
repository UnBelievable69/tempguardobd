name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_16.app

    # КРИТИЧЕСКИЙ ШАГ: Скачиваем и активируем iOS SDK внутри Xcode в облаке
    - name: Install iOS SDK Platform
      run: |
        echo "Downloading and installing iOS platform support..."
        sudo xcodebuild -downloadPlatform iOS

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Resolve Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project FanController.xcodeproj \
          -scheme FanController

    - name: Build and Archive iOS App
      run: |
        xcodebuild archive \
          -project FanController.xcodeproj \
          -scheme FanController \
          -destination "generic/platform=iOS" \
          -archivePath build/FanController.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Package App Binary into IPA
      run: |
        mkdir -p build/Payload
        cp -r build/FanController.xcarchive/Products/Applications/FanController.app build/Payload/
        cd build
        zip -r FanController.ipa Payload
        echo "IPA File successfully created!"

    - name: Upload Finished IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FanController-Unsigned-IPA
        path: build/FanController.ipa
        retention-days: 5
