name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    # 1. Загружаем и проверяем зависимости без промежуточного xcodeproj
    - name: Resolve Dependencies
      run: swift package resolve

    # 2. Собираем приложение напрямую из Package.swift для физического устройства iOS
    - name: Build iOS Application
      run: |
        xcodebuild build \
          -packagepath . \
          -scheme FanController \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          BUILD_DIR="build" \
          -configuration Release

    # 3. Упаковываем полученный .app бинарник в формат .ipa
    - name: Package App Binary into IPA
      run: |
        mkdir -p build/Payload
        # Находим скомпилированное приложение в директории сборки и копируем в Payload
        find build -name "FanController.app" -type d -exec cp -r {} build/Payload/ \;
        cd build
        zip -r FanController.ipa Payload
        echo "IPA File successfully created!"

    # 4. Выгружаем готовый .ipa файл в артефакты сборки
    - name: Upload Finished IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FanController-Unsigned-IPA
        path: build/FanController.ipa
        retention-days: 5
