name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Use the DEFAULT Xcode (16.4) which has iOS SDK pre-installed.
      # No need for xcode-select or -downloadPlatform.
      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FanController.xcodeproj \
            -scheme FanController \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Build and Archive iOS App
        run: |
          xcodebuild archive \
            -project FanController.xcodeproj \
            -scheme FanController \
            -destination "generic/platform=iOS" \
            -archivePath build/FanController.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App Binary into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/FanController.xcarchive/Products/Applications/FanController.app build/Payload/
          cd build
          zip -r FanController.ipa Payload
          echo "IPA File successfully created!"

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanController-Unsigned-IPA
          path: build/FanController.ipa
          retention-days: 5
